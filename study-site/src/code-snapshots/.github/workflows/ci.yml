name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check app tests alembic
      - name: Unit tests
        run: pytest tests -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t book-a-slot .

  live-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: book_a_slot
          POSTGRES_PASSWORD: book_a_slot
          POSTGRES_DB: book_a_slot
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U book_a_slot -d book_a_slot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Live PostgreSQL and Redis smoke test
        env:
          DATABASE_URL: postgresql+psycopg://book_a_slot:book_a_slot@localhost:5432/book_a_slot
          REDIS_URL: redis://localhost:6379/0
          RUN_LIVE: "1"
        run: pytest tests/test_live.py -q